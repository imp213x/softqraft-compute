# Typecheck, unit tests, Postgres tests, boundaries and the vendored kit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test:ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compute
          # Throwaway password for the CI service container only.
          POSTGRES_PASSWORD: compute-ci
          POSTGRES_DB: compute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compute -d compute_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://compute:compute-ci@localhost:5432/compute_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: test:ci (build, typecheck, unit tests, Postgres tests, boundaries, federation vendor)
        run: pnpm run test:ci

      - name: Migrate script against the service database
        run: pnpm --filter @softqraft/compute-api migrate
