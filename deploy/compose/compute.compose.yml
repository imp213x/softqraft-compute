# SoftQraft Compute on SQ-CLOUD-01 (VM 103), its own Compose project beside
# Cloud's (founder decision F1). Release procedure: docs/deploy.md.
#
#   C="docker compose --env-file /etc/softqraft/compute/deployment.env -f deploy/compose/compute.compose.yml"
#   $C run --rm --no-deps compute-api node dist/migrate.js   # migrations, from the built dist
#   $C up -d
#
# Compute keeps no state on the VM (F2): the database is Neon. The public
# origin https://compute.softqraftlabs.com reaches it through Cloud's existing
# cloudflared (F3), over the external network softqraft-edge, created once with
# `docker network create softqraft-edge`.
name: softqraft-compute

services:
  compute-api:
    image: "${SOFTQRAFT_COMPUTE_IMAGE_REPOSITORY:-softqraft/compute}:${SOFTQRAFT_COMPUTE_IMAGE_TAG:?Set SOFTQRAFT_COMPUTE_IMAGE_TAG to the full reviewed Git commit}"
    restart: unless-stopped
    init: true
    env_file:
      - "${SOFTQRAFT_COMPUTE_ENV_FILE:-/etc/softqraft/compute/runtime.env}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # F1: one vCPU and 1 GB, fixed.
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 128m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      edge:
        aliases:
          - compute-api

networks:
  edge:
    name: softqraft-edge
    external: true
